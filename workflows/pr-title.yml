name: PR Title

on:
  workflow_call:

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const types = ['feat','fix','chore','docs','refactor','test','perf','ci','build','revert','style'];
            const pr = context.payload.pull_request;
            let title = pr.title;

            if (context.payload.action === 'opened') {
              const [type, ...rest] = pr.head.ref.split('/');
              if (rest.length) {
                title = `${type}: ${rest.join(' ').replace(/[-_]/g, ' ')}`;
                await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, title });
              }
            }

            const rule = new RegExp(`^(${types.join('|')})(\\(.+\\))?!?: .+`);
            if (!rule.test(title)) {
              core.setFailed(`Title must look like "feat: add login". Got: "${title}"`);
            }
